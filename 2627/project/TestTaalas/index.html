<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        .score {
            font-size: 24px;
            font-weight: bold;
            position: relative;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .game-container {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .game {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000;
            border: 1px solid #fff;
            padding: 20px;
            border-radius: 10px;
            font-size: 36px;
            text-align: center;
        }

        .direction {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #0a0;
            top: 50%;
            left: 50%;
            transform: translate(-25%, -50%);
            cursor: pointer;
        }

        .direction.up {
            top: -25%;
        }

        .direction.right {
            left: -25%;
        }

        .direction.down {
            top: 75%;
        }

        .direction.left {
            left: -25%;
            top: 25%;
        }

        .direction.active {
            box-shadow: 0 0 10px #000;
            border: 2px solid #0a0;
        }
    </style>
</head>
<body>
    <div class="score">Score: <span id="score">0</span></div>
    <div class="game-container">
        <div class="game">
            <div id="canvas" style="position: relative; width: 400px; height: 400px; border: 1px solid #000;">
                <div id="scoreDisplay" style="position: absolute; top: 0; left: 0; font-size: 24px;"></div>
                <div id="snake" style="position: absolute; top: 0; left: 0; width: 20px; height: 20px; background-color: #0f0; border-radius: 20px;"></div>
            </div>
        </div>
        <div class="direction up"></div>
        <div class="direction right"></div>
        <div class="direction down"></div>
        <div class="direction left"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let score = 0;
        let snake = { x: 100, y: 100 };
        let direction = 'up';
        let apple = { x: Math.random() * 20 * 20, y: Math.random() * 20 * 20 };
        let interval;
        let speed = 10;

        function init() {
            ctx.clearRect(0, 0, 400, 400);
            ctx.fillStyle = 'black';
            ctx.font = '36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('Score: ' + score, 200, 20);
            drawScore();
            drawApple();
            interval = setInterval(update, 100);
        }

        function drawScore() {
            ctx.clearRect(0, 0, 100, 50);
            ctx.fillStyle = 'black';
            ctx.font = '24px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Score: ' + score, 10, 20);
        }

        function drawApple() {
            ctx.beginPath();
            ctx.arc(apple.x, apple.y, 10, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawSnake() {
            ctx.fillStyle = 'green';
            ctx.beginPath();
            ctx.arc(snake.x, snake.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.closePath();
        }

        function update() {
            snake.x += 0;
            if (direction == 'up') {
                snake.y -= speed;
            }
            if (direction == 'down') {
                snake.y += speed;
            }
            if (direction == 'left') {
                snake.x -= speed;
            }
            if (direction == 'right') {
                snake.x += speed;
            }
            drawSnake();
            drawApple();
            if (checkCollision()) {
                clearInterval(interval);
                alert('Game over! Your score is ' + score);
            } else {
                drawScore();
                if (score >= 10) {
                    speed += 1;
                }
            }
        }

        function checkCollision() {
            if (snake.x <= 0 || snake.x >= 400 || snake.y <= 0 || snake.y >= 400) {
                return true;
            }
            if (snake.x == apple.x && snake.y == apple.y) {
                score++;
                apple.x = Math.random() * 20 * 20;
                apple.y = Math.random() * 20 * 20;
                snake.x = 100;
                snake.y = 100;
            }
            return false;
        }

        function changeDirection(dir) {
            if (dir == 'up') {
                if (snake.y != 100 - speed) {
                    direction = 'up';
                }
            }
            if (dir == 'down') {
                if (snake.y != 100 + speed) {
                    direction = 'down';
                }
            }
            if (dir == 'left') {
                if (snake.x != 100 - speed) {
                    direction = 'left';
                }
            }
            if (dir == 'right') {
                if (snake.x != 100 + speed) {
                    direction = 'right';
                }
            }
            if (dir == 'left') {
                direction = 'left';
            }
            if (dir == 'right') {
                direction = 'right';
            }
            if (dir == 'up') {
                direction = 'up';
            }
            if (dir == 'down') {
                direction = 'down';
            }
            document.getElementById(dir).style.transform = "translate(0, 0)";
            document.getElementById(dir).style.boxShadow = "0 0 0";
            document.getElementById(dir).style.backgroundColor = "black";
        }

        function start() {
            init();
            document.getElementById('up').style.transform = "translate(0, 25%)";
            document.getElementById('up').style.boxShadow = "0 0 10px #000";
            document.getElementById('up').style.backgroundColor = "lightgreen";
            document.getElementById('down').style.transform = "translate(0, 0)";
            document.getElementById('down').style.boxShadow = "0 0 0";
            document.getElementById('down').style.backgroundColor = "black";
            document.getElementById('left').style.transform = "translate(0, 0)";
            document.getElementById('left').style.boxShadow = "0 0 0";
            document.getElementById('left').style.backgroundColor = "black";
            document.getElementById('right').style.transform = "translate(0, 0)";
            document.getElementById('right').style.boxShadow = "0 0 0";
            document.getElementById('right').style.backgroundColor = "black";
            document.getElementById('up').addEventListener('click', function() {
                changeDirection('up');
            });
            document.getElementById('down').addEventListener('click', function() {
                changeDirection('down');
            });
            document.getElementById('left').addEventListener('click', function() {
                changeDirection('left');
            });
            document.getElementById('right').addEventListener('click', function() {
                changeDirection('right');
            });
        }

        start();

    </script>
</body>
</html>
